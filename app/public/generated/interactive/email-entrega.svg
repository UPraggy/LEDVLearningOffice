  <text x="72" y="324" fill="#4A5670" font-family="Arial" font-size="23"><tspan x="72" dy="0">Há uma taxa alfandegária pendente de R$ 9,90.</tspan><tspan x="72" dy="36">Pague em até 24h para liberar a entrega, senão o</tspan><tspan x="72" dy="36">pacote será devolvido ao remetente.</tspan></text>
