<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-label="Assistente de IA resumindo um texto"><defs>
  <linearGradient id="bg-paper" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#EEF2F6"/><stop offset="1" stop-color="#DFE6EC"/>
  </linearGradient>
  <radialGradient id="bg-glow" cx="0.5" cy="0.08" r="0.9">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <filter id="sh-soft" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#16203A" flood-opacity="0.18"/>
  </filter>
  <filter id="sh-card" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#16203A" flood-opacity="0.13"/>
  </filter></defs>
  <rect width="1000" height="640" fill="url(#bg-paper)"/><rect width="1000" height="320" fill="url(#bg-glow)"/>
  <rect x="48" y="34" width="904" height="572" rx="30" fill="#ffffff" filter="url(#sh-soft)"/><rect x="48" y="34" width="904" height="572" rx="30" fill="none" stroke="#E2D8C2" stroke-width="2"/>
  <linearGradient id="hg-1b2a4e" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3b5c"/><stop offset="1" stop-color="#15203b"/></linearGradient>
  <path d="M48 64 a30 30 0 0 1 30 -30 h844 a30 30 0 0 1 30 30 v78 h-904 z" fill="url(#hg-1b2a4e)"/>
  <path d="M48 64 a30 30 0 0 1 30 -30 h844 a30 30 0 0 1 30 30 v34 h-904 z" fill="url(#sheen)"/>
  <circle cx="126" cy="88" r="34" fill="#5f6a83"/><circle cx="126" cy="88" r="34" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="3"/><text x="126" y="99.56" text-anchor="middle" fill="#fff" font-family="Arial" font-size="32" font-weight="700">I</text>
  <text x="180" y="80" fill="#fff" font-family="Arial" font-size="26" font-weight="700">Assistente</text>
  <text x="180" y="116" fill="#9fa6b5" font-family="Arial" font-size="20" font-weight="700">resumir texto</text>
  <rect x="420" y="188" width="460" height="70" rx="22" fill="#cedae8"/><path d="M880 222 l22 -6 l-22 -22 z" fill="#cedae8"/>
  <text x="448" y="230" fill="#1A2540" font-family="Arial" font-size="22">Resuma este texto em 2 frases:</text>
  <rect x="120" y="296" width="600" height="230" rx="18" fill="#F4F6FA" filter="url(#sh-card)"/><rect x="120" y="296" width="600" height="230" rx="18" fill="none" stroke="#D9CFB8" stroke-width="2"/>
  <circle cx="150" cy="326" r="18" fill="#1B2A4E"/><circle cx="150" cy="326" r="18" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="3"/><text x="150" y="332.12" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17" font-weight="700">✦</text>
  <text x="184" y="334" fill="#5A6173" font-family="Arial" font-size="18" font-weight="700">Resposta</text>
  <text x="150" y="382" fill="#1A2540" font-family="Arial" font-size="22"><tspan x="150" dy="0">O texto explica como pagar contas pelo</tspan><tspan x="150" dy="36">aplicativo do banco com segurança, usando</tspan><tspan x="150" dy="36">senha e confirmação em duas etapas.</tspan></text>
</svg>
