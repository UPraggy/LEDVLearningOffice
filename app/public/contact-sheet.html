<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Sheet — Cenas Interativas</title>
<style>
  body { margin:0; background:#11161f; color:#E8DCC4; font-family:system-ui,sans-serif; }
  h1 { text-align:center; font-weight:600; padding:18px 0 4px; }
  p.sub { text-align:center; margin:0 0 18px; opacity:.6; font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; padding:0 24px 48px; max-width:1700px; margin:0 auto; }
  figure { margin:0; background:#1b2230; border:1px solid #2c3647; border-radius:14px; overflow:hidden; }
  figure img { width:100%; display:block; background:#E9EEF2; }
  figcaption { padding:8px 12px; font-size:13px; display:flex; justify-content:space-between; gap:8px; }
  figcaption b { color:#fff; font-weight:600; }
  figcaption span { opacity:.55; font-family:monospace; }
</style>
</head>
<body>
<h1>Cenas Interativas</h1>
<p class="sub" id="count"></p>
<div class="grid" id="grid"></div>
<script>
const slugs = ["agenda-evento","app-saude","boleto-pagar","busca-web","calculadora","carrinho-compras","cartao-bloqueado","config-celular","contatos","dialogo-ingles","dois-fatores","download-arquivo","editor-texto","email-entrega","email-lista","email-phishing","email-redacao","excel-erro","excel-procv","excel-soma","extrato-banco","flashcard-ingles","formulario-online","galeria-fotos","ia-chat","ia-resumo","impressora","janela-arquivos","ligacao-golpe","lixeira","loja-app","mapa-onibus","mapa-rota","mensagem-audio","menu-restaurante","navegador-url","nota-falsa","notificacoes","nuvem-backup","pix-confirmacao","pix-recebido","placas-aeroporto","planilha-grafico","popup-atualizacao","popup-virus","qr-code","recibo-venda","senha-forte","site-gov-falso","sms-banco","sms-gov","teclado-digitar","tradutor","video-tutorial","videochamada","wifi-conectar","wifi-publico","windows-desktop","wpp-chefe","wpp-golpe","wpp-promo"];
const grid = document.getElementById('grid');
document.getElementById('count').textContent = slugs.length + ' cenas';
for (const s of slugs) {
  const fig = document.createElement('figure');
  fig.innerHTML = '<img loading="lazy" src="/generated/interactive/'+s+'.svg" alt="'+s+'"><figcaption><b>'+s+'</b><span>'+s+'</span></figcaption>';
  grid.appendChild(fig);
}
</script>
</body>
</html>
